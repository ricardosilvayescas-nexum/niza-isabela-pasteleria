<!DOCTYPE html>
<html lang="es" style="background-color:#FFFDEE;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFFDEE">
<title>Recuperar contraseña — Niza Isabela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>.msg{font-size:13px; margin-top:14px; text-align:center;} .msg.error{color:#A0522D;} .msg.ok{color:#5B7A4E;}</style>
</head>
<body style="background-color:#FFFDEE;">

<nav class="site-nav">
  <a class="logo" href="index.html">Niza <span>Isabela</span></a>
</nav>

<div class="form-wrap" style="max-width:420px;">
  <div class="form-head">
    <div class="eyebrow">Mi cuenta</div>
    <h1>Recuperar contraseña</h1>
    <p>Escribe tu correo y te enviaremos un enlace para crear una nueva contraseña.</p>
  </div>

  <form class="panel" id="olvide-form">
    <div class="field"><label>Correo</label><input type="email" id="email" required></div>
    <button class="btn btn-primary btn-block" type="submit">Enviar enlace</button>
    <div class="msg" id="olvide-msg"></div>
  </form>

  <p style="text-align:center; margin-top:20px; font-size:13.5px; color:var(--grey);">
    <a href="login.html" style="color:var(--accent-deep); font-weight:600;">← Volver a iniciar sesión</a>
  </p>
</div>

<footer class="footer-simple">© Niza Isabela Pastelería — Amecameca, México</footer>

<script src="js/main.js"></script>
<script>
  document.getElementById('olvide-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const boton = e.target.querySelector('button');
    const msg = document.getElementById('olvide-msg');
    boton.disabled = true;
    msg.textContent = 'Enviando...'; msg.className = 'msg';
    try {
      const res = await fetch(`${API_BASE_URL}/api/auth/olvide-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value }),
      });
      const data = await res.json();
      msg.textContent = data.mensaje;
      msg.className = 'msg ok';
    } catch (err) {
      msg.textContent = 'Hubo un error. Intenta de nuevo.';
      msg.className = 'msg error';
      boton.disabled = false;
    }
  });
</script>
</body>
</html>
