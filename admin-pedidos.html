<!DOCTYPE html>
<html lang="es" style="background-color:#FFFDEE;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFFDEE">
<link rel="icon" type="image/jpeg" href="https://nizaisabelastorage.blob.core.windows.net/archivos-publicos/imagen/b8497190-4fa9-45da-a07a-f468cb28aed8.jpg">
<title>Pedidos — Panel Admin Niza Isabela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .toolbar{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .toolbar select{ width:auto; padding:8px 14px; font-size:12.5px; border-radius:20px; }
  .status-select{ font-size:11.5px; padding:5px 10px; border-radius:12px; border:1px solid var(--line); background:#fff; }
  table.admin-table td:last-child{ padding-left:16px; }
</style>
</head>
<body style="background-color:#FFFDEE;">

<div class="app">
  <div class="sidebar">
    <a class="logo" href="admin.html">Niza <span>Isabela</span></a>
    <div class="sidebar-nav">
      <a class="nav-item" href="admin.html">📊 Reportes</a>
      <a class="nav-item active" href="admin-pedidos.html">🧁 Pedidos</a>
      <a class="nav-item" href="admin-cotizaciones.html">✉️ Cotizaciones</a>
      <a class="nav-item" href="admin-cursos.html">📄 Cursos</a>
      <a class="nav-item" href="admin-catalogo.html">🍰 Catálogo</a>
      <a class="nav-item" href="admin-dudas.html">💬 Dudas</a>
      <div class="nav-section">Configuración</div>
      <a class="nav-item" href="admin-sucursales.html">🏪 Sucursales</a>
      <a class="nav-item" href="admin-ajustes.html">⚙️ Ajustes generales</a>
    </div>
  </div>

  <div class="admin-main">
    <div class="topbar">
      <h1>Pedidos</h1>
      <div class="period" style="cursor:pointer;" onclick="abrirModalPedidoManual()">+ Nuevo pedido manual</div>
    </div>

    <div class="toolbar">
      <select id="filtro-sucursal"><option value="">Todas las sucursales</option></select>
      <select id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="recibido">Recibido</option>
        <option value="en_produccion">En producción</option>
        <option value="listo">Listo</option>
        <option value="entregado">Entregado</option>
      </select>
    </div>

    <div class="admin-panel">
      <table class="admin-table" id="pedidos-table">
        <tr><th>Pedido</th><th>Cliente</th><th>Producto</th><th>Sucursal</th><th>Entrega</th><th>Total</th><th>Estado</th><th></th></tr>
      </table>
    </div>
  </div>
</div>

<!-- MODAL PEDIDO MANUAL -->
<div class="modal-overlay" id="pedido-manual-modal">
  <div class="modal" style="grid-template-columns:1fr; max-width:520px;">
    <button class="modal-close" onclick="cerrarModalPedidoManual()">✕</button>
    <div class="modal-body">
      <h3>Nuevo pedido manual</h3>
      <label class="small">Nombre del cliente</label>
      <input type="text" id="pm-nombre" style="margin-bottom:14px;">
      <label class="small">Teléfono (opcional)</label>
      <input type="tel" id="pm-telefono" style="margin-bottom:14px;">
      <label class="small">Descripción del pedido</label>
      <textarea id="pm-descripcion" placeholder="Ej. Pastel 3 pisos, chocolate y vainilla, tema safari, para 40 personas" style="margin-bottom:14px;"></textarea>
      <label class="small">Método de entrega</label>
      <select id="pm-entrega" style="margin-bottom:14px;">
        <option value="recoger">Recoger en sucursal</option>
        <option value="delivery">Delivery</option>
      </select>
      <div id="pm-sucursal-wrap" style="margin-bottom:14px;">
        <label class="small">Sucursal</label>
        <select id="pm-sucursal"><option value="">Cargando…</option></select>
      </div>
      <label class="small">Fecha de entrega</label>
      <input type="date" id="pm-fecha" style="margin-bottom:14px;">
      <label class="small">Total acordado (MXN)</label>
      <input type="number" id="pm-total" style="margin-bottom:20px;">
      <button class="btn btn-primary btn-block" onclick="guardarPedidoManual()">Guardar pedido</button>
    </div>
  </div>
</div>

<!-- MODAL DETALLE DE PEDIDO -->
<div class="modal-overlay" id="pedido-detalle-modal">
  <div class="modal" style="grid-template-columns:1fr; max-width:520px;">
    <button class="modal-close" onclick="cerrarModalDetallePedido()">✕</button>
    <div class="modal-body">
      <h3 style="margin-bottom:4px;">Detalle del pedido</h3>
      <div style="font-size:13px; color:var(--grey); margin-bottom:8px;" id="pd-meta"></div>

      <div class="detalle-row">
        <div class="detalle-label">Cliente</div>
        <div class="detalle-valor" id="pd-cliente"></div>
      </div>
      <div class="detalle-row">
        <div class="detalle-label">Teléfono</div>
        <div class="detalle-valor" id="pd-telefono"></div>
      </div>
      <div class="detalle-row">
        <div class="detalle-label">Detalle / productos</div>
        <div class="detalle-valor" id="pd-productos"></div>
      </div>
      <div class="detalle-row">
        <div class="detalle-label">Entrega</div>
        <div class="detalle-valor" id="pd-entrega"></div>
      </div>
      <div class="detalle-row">
        <div class="detalle-label">Total</div>
        <div class="detalle-valor total" id="pd-total"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/animations.js"></script>
<script>requireAdmin();</script>
<script>
  const ESTADOS = ['recibido', 'en_produccion', 'listo', 'entregado'];
  const ESTADO_LABEL = { recibido: 'Recibido', en_produccion: 'En producción', listo: 'Listo', entregado: 'Entregado' };

function claseEstadoPedido(estado) {
    if (estado === 'entregado') return 'st-verde';
    if (estado === 'listo') return 'st-amarillo';
    return 'st-rojo'; // recibido, en_produccion
  }

  let pedidosCache = [];
  let mapaSucursalesCache = {};

  function pedidoRowHTML(p, mapaSucursales) {
    const opciones = ESTADOS.map(e => `<option value="${e}" ${e === p.estado ? 'selected' : ''}>${ESTADO_LABEL[e]}</option>`).join('');
    return `
      <tr>
        <td>#${p.id.slice(0, 8)}</td>
        <td>${p.cliente_nombre}</td>
        <td>${p.productos.length > 40 ? p.productos.slice(0, 40) + '…' : p.productos}</td>
        <td>${p.sucursal_id ? (mapaSucursales[p.sucursal_id] || '—') : '—'}</td>
        <td>${p.tipo_entrega === 'recoger' || p.tipo_entrega === 'delivery' ? new Date(p.fecha_entrega).toLocaleDateString('es-MX') : 'Digital'}</td>
        <td>$${p.total.toFixed(0)}</td>
        <td><select class="status-select ${claseEstadoPedido(p.estado)}" onchange="cambiarEstadoPedido('${p.id}', this.value, this)">${opciones}</select></td>
        <td><button class="btn-mini" onclick="verDetallePedido('${p.id}')">Ver detalle</button></td>
      </tr>`;
  }

  function verDetallePedido(id) {
    const p = pedidosCache.find(x => x.id === id);
    if (!p) return;
    const sucursalNombre = p.sucursal_id ? (mapaSucursalesCache[p.sucursal_id] || '—') : '—';
    const entregaTexto = p.tipo_entrega === 'digital'
      ? 'Digital (curso)'
      : `${p.tipo_entrega === 'recoger' ? 'Recoger en ' + sucursalNombre : 'Delivery'} — ${new Date(p.fecha_entrega).toLocaleDateString('es-MX')}`;

    document.getElementById('pd-meta').textContent = `Pedido #${p.id.slice(0, 8)} · ${new Date(p.created_at).toLocaleDateString('es-MX')}`;
    document.getElementById('pd-cliente').textContent = p.cliente_nombre;
    document.getElementById('pd-telefono').textContent = p.cliente_telefono || 'No registrado';
    document.getElementById('pd-productos').textContent = p.productos;
    document.getElementById('pd-entrega').textContent = entregaTexto;
    document.getElementById('pd-total').textContent = `$${p.total.toFixed(0)} MXN`;

    document.getElementById('pedido-detalle-modal').classList.add('open');
  }

  function cerrarModalDetallePedido() {
    document.getElementById('pedido-detalle-modal').classList.remove('open');
  }

  async function cargarPedidosAdmin() {
    const tabla = document.getElementById('pedidos-table');
    const sucursalId = document.getElementById('filtro-sucursal').value;
    const estado = document.getElementById('filtro-estado').value;

    try {
      const params = new URLSearchParams();
      if (sucursalId) params.set('sucursal_id', sucursalId);
      if (estado) params.set('estado', estado);

      const [pedidos, sucursales] = await Promise.all([
        authFetch(`${API_BASE_URL}/api/pedidos/admin/completo?${params}`).then(r => r.json()),
        fetchSucursales(),
      ]);
      pedidosCache = pedidos;
      const mapaSucursales = Object.fromEntries(sucursales.map(s => [s.id, s.nombre]));
      mapaSucursalesCache = mapaSucursales;

      tabla.innerHTML = '<tr><th>Pedido</th><th>Cliente</th><th>Producto</th><th>Sucursal</th><th>Entrega</th><th>Total</th><th>Estado</th><th></th></tr>' +
        (pedidos.length ? pedidos.map(p => pedidoRowHTML(p, mapaSucursales)).join('') : '<tr><td colspan="7" style="text-align:center; color:var(--grey);">No hay pedidos todavía.</td></tr>');

      // Llenar el select de sucursales solo la primera vez
      const filtroSucursal = document.getElementById('filtro-sucursal');
      if (filtroSucursal.options.length === 1) {
        sucursales.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id; opt.textContent = s.nombre;
          filtroSucursal.appendChild(opt);
        });
      }
    } catch {
      tabla.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--grey);">No se pudieron cargar los pedidos.</td></tr>';
    }
  }

  async function abrirModalPedidoManual() {
    document.getElementById('pm-nombre').value = '';
    document.getElementById('pm-telefono').value = '';
    document.getElementById('pm-descripcion').value = '';
    document.getElementById('pm-entrega').value = 'recoger';
    document.getElementById('pm-fecha').value = '';
    document.getElementById('pm-total').value = '';

    const select = document.getElementById('pm-sucursal');
    if (select.options.length <= 1) {
      const sucursales = await fetchSucursales();
      select.innerHTML = sucursales.map(s => `<option value="${s.id}">${s.nombre}</option>`).join('');
    }

    document.getElementById('pedido-manual-modal').classList.add('open');
  }

  function cerrarModalPedidoManual() {
    document.getElementById('pedido-manual-modal').classList.remove('open');
  }

  document.getElementById('pm-entrega').addEventListener('change', function () {
    document.getElementById('pm-sucursal-wrap').style.display = this.value === 'recoger' ? 'block' : 'none';
  });

  async function guardarPedidoManual() {
    const nombre = document.getElementById('pm-nombre').value.trim();
    const descripcion = document.getElementById('pm-descripcion').value.trim();
    const fecha = document.getElementById('pm-fecha').value;
    const total = parseFloat(document.getElementById('pm-total').value);
    const tipoEntrega = document.getElementById('pm-entrega').value;

    if (!nombre || !descripcion || !fecha || !total) {
      alert('Completa nombre, descripción, fecha y total.');
      return;
    }

    const datos = {
      cliente_nombre: nombre,
      cliente_telefono: document.getElementById('pm-telefono').value.trim() || null,
      sucursal_id: tipoEntrega === 'recoger' ? document.getElementById('pm-sucursal').value : null,
      tipo_entrega: tipoEntrega,
      fecha_entrega: fecha,
      descripcion: descripcion,
      total: total,
    };

    try {
      const res = await authFetch(`${API_BASE_URL}/api/pedidos/admin/manual`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos),
      });
      if (!res.ok) throw new Error();
      cerrarModalPedidoManual();
      cargarPedidosAdmin();
    } catch {
      alert('Hubo un error al guardar el pedido.');
    }
  }

  async function cambiarEstadoPedido(id, nuevoEstado, selectEl) {
    await authFetch(`${API_BASE_URL}/api/pedidos/${id}/estado?nuevo_estado=${nuevoEstado}`, { method: 'PATCH' });
    if (selectEl) {
      selectEl.classList.remove('st-rojo', 'st-amarillo', 'st-verde');
      selectEl.classList.add(claseEstadoPedido(nuevoEstado));
    }
  }

  document.getElementById('filtro-sucursal').addEventListener('change', cargarPedidosAdmin);
  document.getElementById('filtro-estado').addEventListener('change', cargarPedidosAdmin);

  cargarPedidosAdmin();
</script>
</body>
</html>
