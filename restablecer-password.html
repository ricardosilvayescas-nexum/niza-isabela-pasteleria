<!DOCTYPE html>
<html lang="es" style="background-color:#FFFDEE;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFFDEE">
<title>Nueva contraseña — Niza Isabela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>.msg{font-size:13px; margin-top:14px; text-align:center;} .msg.error{color:#A0522D;} .msg.ok{color:#5B7A4E;}</style>
</head>
<body style="background-color:#FFFDEE;">

<nav class="site-nav">
  <a class="logo" href="index.html">Niza <span>Isabela</span></a>
</nav>

<div class="form-wrap" style="max-width:420px;">
  <div class="form-head">
    <div class="eyebrow">Mi cuenta</div>
    <h1>Crea tu nueva contraseña</h1>
  </div>

  <form class="panel" id="reset-form">
    <div class="field"><label>Nueva contraseña</label><input type="password" id="password" required minlength="6"></div>
    <div class="field"><label>Confirma tu nueva contraseña</label><input type="password" id="password-confirm" required minlength="6"></div>
    <button class="btn btn-primary btn-block" type="submit">Guardar contraseña</button>
    <div class="msg" id="reset-msg"></div>
  </form>

  <p style="text-align:center; margin-top:20px; font-size:13.5px; color:var(--grey);">
    <a href="login.html" style="color:var(--accent-deep); font-weight:600;">← Volver a iniciar sesión</a>
  </p>
</div>

<footer class="footer-simple">© Niza Isabela Pastelería — Amecameca, México</footer>

<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('reset-msg').className = 'msg error';
    document.getElementById('reset-msg').textContent = 'Enlace inválido. Solicita uno nuevo desde "Olvidé mi contraseña".';
  }

  document.getElementById('reset-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const boton = e.target.querySelector('button');
    const msg = document.getElementById('reset-msg');
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('password-confirm').value;

    if (password !== passwordConfirm) {
      msg.className = 'msg error';
      msg.textContent = 'Las contraseñas no coinciden.';
      return;
    }

    boton.disabled = true;
    msg.textContent = 'Guardando...'; msg.className = 'msg';
    try {
      const res = await fetch(`${API_BASE_URL}/api/auth/restablecer-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password_nueva: password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Error al restablecer la contraseña.');

      msg.className = 'msg ok';
      msg.textContent = data.mensaje + ' Redirigiendo...';
      setTimeout(function () { window.location.href = 'login.html'; }, 1800);
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = err.message;
      boton.disabled = false;
    }
  });
</script>
</body>
</html>
